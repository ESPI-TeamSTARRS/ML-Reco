[project]
name = "visage-id"
version = "0.1.0"
description = "Détection et reconnaissance de visage pour le back-office (inférence uniquement, sans PyTorch)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.11,<4.12",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visage_id"]


[dependency-groups]
dev = ["pytest>=9.1.1"]
